name: tests

# Seven suites in six jobs, each verifying a claim this repository makes in
# prose.
#
#   maths      the README says the deterministic transcendentals are bit-identical
#              across V8 and JavaScriptCore. This runs both engines and checks it,
#              plus the control: that the BUILT-IN functions do disagree. Without
#              the control the test could pass on two identical engines and prove
#              nothing.
#   physics    the geometry, elevation, banking and roll invariants underlying
#              the physics-related part of the orientation-fix sequence. Three of
#              those eight corrective commits are in scope; the rest were camera,
#              mesh and tree orientation, which nothing here renders. It also runs
#              track-bake, which checks the baked circuit centrelines still equal a
#              fresh sampling with the vendored three.js.
#   parity     a whole race on each circuit, run headless with no meshes, and the
#              final state of every car hashed against a committed digest. This is
#              the proof that a change to the engine moved no lap time. It runs a
#              transcription of the race loop, not 40-game.js itself, and is
#              retired when the race rules get a headless entry point.
#   migrations all seventeen migrations applied to an empty PostgreSQL, then the
#              security model asserted: PII unreachable, no client write path,
#              rename is self-only, the board is data-minimised. Also that every
#              circuit in src/20-track.js has a row in track_versions — Monaco
#              shipped without one and every score posted on it was rejected.
#   music      that adding Monaco's 3/4 waltz did not disturb the three 4/4
#              themes it shares a scheduler with. Their whole scheduled event
#              stream is pinned to a digest, because a background loop whose
#              backbeat quietly moved is not something anyone would notice.
#   tiers      which picture tier a device is given, and when the heavy one is
#              taken away: the rules at the top of src/38-tiers.js, each
#              run against a fake storage with no browser. The saved settings
#              are part of it: this build must never write the key it shares
#              with the live game.
#
# Not covered here: anything that renders. test/picture.js and test/csp.js draw
# the page in Chromium and are run by hand, because they need a browser and a
# check that passes on a runner where it could not run is worse than no check.

on:
  push:
    branches: ['**']
  pull_request:

# A push that lands while an earlier run is still going makes the earlier one
# irrelevant — unlike the deploy workflow, cancelling a test run loses nothing.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maths:
    name: maths — cross-engine determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Both engines are the point of this job. Without bun the test reports SKIP
      # for the two cross-engine assertions and still checks the golden digest —
      # honest, but only half the claim, so install it rather than accept that.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: node test/fpmath.test.js

  physics:
    name: physics — sign conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node test/physics.test.js
      - run: node test/track-bake.test.js

  parity:
    name: 'parity: race loop digests'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node test/sim-parity.test.js

  music:
    name: music — themes and scheduler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node test/music.test.js

  tiers:
    name: 'tiers: who is given which picture'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node test/tiers.test.js

  migrations:
    name: migrations — schema and security model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # NEEDS 15 OR LATER: the leaderboard view uses security_invoker, which does
      # not exist before it. The runner image ships a server, but pin the version
      # rather than inherit whatever the image happens to carry this month — on 14
      # the view fails, 0001 and 0003 abort, the seeds fail downstream on a
      # foreign key, and the whole cascade reads like a defect in the migrations.
      - name: Install PostgreSQL 17
        run: |
          set -euo pipefail
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-17
          /usr/lib/postgresql/17/bin/initdb --version

      # The script starts its own cluster on a unix socket, so nothing needs to
      # be listening beforehand and there is no service container to configure.
      - run: ./test/migrations.sh
